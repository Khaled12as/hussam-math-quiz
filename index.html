:root{color-scheme:light;--navy:#123866;--blue:#1E4E8C;--gold:#C9A04A;--gold2:#EBD7A2;--lt:#EEF4FB;--line:#D8E2EE;--ok:#1E8E5A;--okbg:#E7F6EE;--no:#C0392B;--nobg:#FCECEA;--ink:#1d2433}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:linear-gradient(180deg,#F4F8FD,#fff 40%);color:var(--ink);font:17px/1.6 AL,Alm,sans-serif;overflow-x:clip}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 2px 10px rgba(18,56,102,.06)}
.top img{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold2)}
.top .n1{font-family:AlmB;color:var(--navy);font-size:16px;line-height:1.3;white-space:nowrap}
.top .n2{font-size:11px;color:var(--gold);white-space:nowrap}
.top .ph{margin-right:auto;text-align:left;direction:ltr;font-size:11px;color:var(--gold);white-space:nowrap}
.top .ph b{display:block;color:var(--navy);font-size:17px}
.hero{text-align:center;margin:18px 0 8px}
.hero h1{font-family:Expo;font-weight:400;letter-spacing:0;color:var(--blue);font-size:clamp(34px,9vw,48px);line-height:1.15;margin:0}
.hero p{margin:4px 0 0;color:#5a6577;font-size:15px}
h2{font-family:Expo;font-weight:400;color:var(--navy);font-size:19px;margin:18px 4px 10px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit{font:inherit;font-family:AlmB;font-size:15px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;min-height:64px;cursor:pointer;text-align:right;display:flex;align-items:center;gap:10px}
.unit .k{font-family:AL;flex:none;width:32px;height:32px;border-radius:50%;background:var(--lt);display:grid;place-items:center;color:var(--blue);font-size:14px}
.unit small{display:block;font-family:Alm;color:#6b7686;font-size:12.5px}
.unit.all{grid-column:1/-1;background:var(--navy);color:#fff;border-color:var(--navy)}
.unit.all .k{background:var(--gold);color:#fff}.unit.all small{color:#d9e3f1}
.unit:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.95);padding:10px 2px 8px;margin-top:12px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#5a6577;font-family:AlmB}
.meta .sc{color:var(--ok)}
.prog{height:8px;background:var(--lt);border-radius:8px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));width:0;transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;box-shadow:0 4px 18px rgba(18,56,102,.07);margin-top:8px}
.tag{display:inline-block;font-family:AlmB;font-size:12.5px;color:var(--blue);background:var(--lt);border-radius:20px;padding:2px 12px}
.qn{font-family:Expo;color:var(--gold);font-size:15px;margin:10px 0 2px}
.q{font-family:AlmB;font-size:19px;line-height:1.85;color:var(--navy);margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-family:AlmB;font-size:18px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;min-height:56px;padding:10px 14px;text-align:right;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s,border-color .15s}
.opt .l{font-family:AL;flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}.opt.no .l{background:var(--no);border-color:var(--no);color:#fff}
.tfs{grid-template-columns:1fr 1fr}.tfs .opt{justify-content:center}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:16px;display:none}
.fb.ok{display:block;background:var(--okbg);border:1px solid #b6e2c9}.fb.no{display:block;background:var(--nobg);border:1px solid #f1c3bd}
.fb b{font-family:AlmB;display:block;font-size:17px}.fb.ok b{color:var(--ok)}.fb.no b{color:var(--no)}
.btn{font:inherit;font-family:AlmB;font-size:17px;border:0;border-radius:14px;min-height:52px;padding:10px 20px;cursor:pointer;background:var(--navy);color:#fff;width:100%;margin-top:14px}
.btn.gh{background:#fff;color:var(--navy);border:2px solid var(--line)}
.res{text-align:center}
.ring{width:170px;height:170px;margin:10px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--lt) 0)}
.ring div{width:134px;height:134px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:AL;color:var(--navy);font-size:34px;line-height:1.1}
.ring small{display:block;font-size:15px;color:#5a6577}
.msg{font-family:Expo;color:var(--navy);font-size:21px;margin:6px 0}
.row{display:flex;gap:10px}.row .btn{flex:1}
.foot{text-align:center;color:#6b7686;font-size:13px;margin-top:22px}
.foot b{color:var(--navy);font-family:AlmB}
.hide{display:none}
/* math */
.m{font-family:AL;unicode-bidi:isolate;direction:ltr;display:inline-flex;align-items:center;gap:2px;white-space:nowrap;vertical-align:middle}
i{font-family:AL;font-style:italic}
.m sup{font-size:.65em;align-self:flex-start;line-height:1}.m sub{font-size:.65em;align-self:flex-end;line-height:1}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.88em;margin:0 2px}
.fr>span{padding:0 3px;line-height:1.25;display:inline-flex;align-items:center;gap:2px}.fr>span:first-child{border-bottom:1.5px solid currentColor}
.sq{display:inline-flex;align-items:stretch}.sq .rd{font-size:1.25em;line-height:1;align-self:center}
.sq .rc{border-top:1.5px solid currentColor;padding:2px 2px 0;display:inline-flex;align-items:center;gap:2px}
.sq .ri{font-size:.55em;align-self:flex-start;margin-right:-5px;margin-top:1px}
.ov{text-decoration:overline;text-decoration-thickness:1.5px}
.vec{position:relative;font-style:italic;display:inline-block;padding-top:.35em}
.vec::after{content:"";position:absolute;left:0;right:-2px;top:.15em;height:1.5px;background:currentColor}
.vec::before{content:"";position:absolute;right:-3px;top:-.02em;border:4px solid transparent;border-left:6px solid currentColor;border-right:0}

.lessons{display:none;grid-column:1/-1;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px;margin-top:-4px}
.lessons.on{display:grid;gap:6px}
.les{font:inherit;font-family:AlmB;font-size:14.5px;color:var(--navy);background:var(--lt);border:0;border-radius:10px;min-height:46px;padding:8px 12px;text-align:right;cursor:pointer;display:flex;align-items:center;gap:8px}
.les b{font-family:AL;color:var(--gold);flex:none;direction:ltr}
.les small{margin-right:auto;font-family:Alm;color:#6b7686;font-size:12px;flex:none}
.les.full{background:var(--navy);color:#fff}.les.full small{color:#d9e3f1}
.unit[aria-expanded=true]{border-color:var(--blue)}
.qi{display:block;max-width:100%;height:auto;margin:10px auto 0;border-radius:8px;background:#fff}
.tb{border-collapse:collapse;margin:8px auto 0;font-family:AL}.tb td{border:1.5px solid var(--line);padding:4px 10px;text-align:center}
.tb tr:first-child td{background:var(--lt)}
.src{font-size:11.5px;color:#8a94a3;font-family:Alm;margin-right:6px}
.quick{grid-column:1/-1;display:flex;gap:10px}.quick .unit{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.yr{display:block;font-family:Alm;font-size:12px;color:#7b8594;margin-top:2px}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1}.lim .lu{font-size:.62em}
.pw{display:inline-flex;align-items:center;vertical-align:middle}.pw .br{font-size:2.4em;font-weight:300;line-height:1;margin-right:2px}.pw .pg{display:inline-grid;grid-template-columns:auto auto;column-gap:10px;row-gap:2px;font-size:.92em}
.gnav{display:flex;justify-content:center;margin-top:14px}
.gnav a{display:inline-flex;align-items:center;gap:8px;font-family:AlmB;font-size:15px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 22px;text-decoration:none;min-height:44px;box-shadow:0 2px 10px rgba(18,56,102,.06);transition:border-color .15s,color .15s}
.gnav a:hover{border-color:var(--blue);color:var(--blue)}
.gnav a::before{content:"⇄";color:var(--gold);font-family:AL}

  const btns=[...$("opts").children];
  if(btns[0].disabled)return;
  btns.forEach(b=>b.disabled=true);
  const ok=cur.oo[k].ok, right=cur.oo.findIndex(o=>o.ok);
  btns[right].classList.add("ok");
  if(ok){score++;$("fb").className="fb ok";$("fb").innerHTML=`<b>${["أحسنت! إجابة صحيحة","ممتاز! إجابة صحيحة","رائع! إجابة صحيحة"][Math.floor(Math.random()*3)]}</b>${cur.e||""}`}
  else{btns[k].classList.add("no");$("fb").className="fb no";$("fb").innerHTML=`<b>إجابة خاطئة · الصحيح: ${cur.tf?cur.oo[right].t:(cur.fix?"("+"abcd"[right]+")":L[right])}</b>${cur.e||""}`}
  $("sc").textContent=`الدرجة: ${score}`;
  $("next").textContent=i+1<set.length?"السؤال التالي":"عرض النتيجة";
  $("next").classList.remove("hide");
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finish(){
  const p=Math.round(score/set.length*100);
  $("ring").style.setProperty("--p",p);
  $("pct").textContent=p+"%";$("frac").textContent=`${score} / ${set.length}`;
  $("msg").textContent=p>=90?"ممتاز! أداء رائع":p>=75?"جيد جدًا! واصل التقدم":p>=50?"جيد، تحتاج إلى مراجعة بسيطة":"راجع الدروس وحاول مرة أخرى";
  $("sub").textContent=label;show("result");
}
$("units").addEventListener("click",e=>{
  const u=e.target.closest(".unit[data-u]");
  if(u){const box=$("ls"+u.dataset.u),on=!box.classList.contains("on");document.querySelectorAll(".lessons").forEach(b=>b.classList.remove("on"));document.querySelectorAll(".unit[data-u]").forEach(b=>b.setAttribute("aria-expanded","false"));if(on){box.classList.add("on");u.setAttribute("aria-expanded","true")}return}
  const b=e.target.closest("[data-k]");if(b)start(b.dataset.k);
});
$("opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k)});
$("next").addEventListener("click",()=>{i++;i<set.length?(render(),window.scrollTo({top:0,behavior:"smooth"})):finish()});
$("quit").addEventListener("click",()=>show("home"));
$("again").addEventListener("click",()=>start(last));
$("back").addEventListener("click",()=>show("home"));
}
</script></body></html>
